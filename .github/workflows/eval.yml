name: Evaluate
on:
  workflow_dispatch:
    inputs:
      set: { description: 'Event set', required: false, default: 'eval/events.draft.jsonl' }
      limit: { description: 'Only the first N events', required: false }
      check_only: { description: 'Only check the set against 10-K text (no models)', type: boolean, default: false }
permissions:
  contents: read
concurrency: reed-data
jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: ${{ inputs.check_only }}
        run: node scripts/check-set.mjs --set "${SET:-eval/events.draft.jsonl}" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          SET: ${{ inputs.set }}
      - if: ${{ !inputs.check_only }}
        run: node scripts/eval.mjs --set "${SET:-eval/events.draft.jsonl}" ${LIMIT:+--limit "$LIMIT"}
        env:
          SET: ${{ inputs.set }}
          LIMIT: ${{ inputs.limit }}
      - if: ${{ !inputs.check_only }}
        uses: actions/upload-artifact@v4
        with: { name: eval-results, path: out/ }
      - if: ${{ !inputs.check_only }}
        run: cat out/eval-report.md >> "$GITHUB_STEP_SUMMARY"
